<!doctype html>
<html lang="it"><head>
<meta name="robots" content="noindex,nofollow"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ringline</title>
<style>
:root{--bg:#0b0b0b;--p:rgba(18,18,18,.86);--g:#d5ad55;--t:#f5f2eb;--m:#c2bdb2;--l:#4a4a4a;--gt:#f0d38b;--n:rgba(28,24,15,.92);--sil:#2c2c2c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 Arial,Helvetica,sans-serif}
.bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
header,main,footer{position:relative;z-index:1}
header{padding:22px 5%;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;color:var(--g);letter-spacing:2px;font-size:clamp(26px,6vw,34px)}
.tag{color:var(--m);font-size:13px}
button,select,input{font:inherit;font-size:15px}
button{background:var(--p);color:var(--t);border:1px solid var(--l);padding:8px 12px;border-radius:6px;cursor:pointer}
button.on{border-color:var(--g);color:var(--g);font-weight:bold}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--g);outline-offset:2px}
main{max-width:1100px;margin:auto;padding:20px 5% 40px}
h2{font-size:24px;margin:0 0 6px}h3{font-size:18px;margin:0 0 6px;color:var(--gt)}
.m{color:var(--m);font-size:14px}
.v{display:none}.v.on{display:block}
.card{background:var(--p);border:1px solid var(--l);border-radius:8px;padding:15px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.grid .card{margin:0}
.pill{display:inline-block;border:1px solid var(--g);color:var(--gt);border-radius:20px;padding:2px 10px;font-size:13px;margin:0 6px 6px 0}
.pill.c{background:var(--g);color:#111;font-weight:bold}
.note{border-left:4px solid var(--g);background:var(--n);padding:12px;margin:14px 0;font-size:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
input,select{background:var(--p);color:var(--t);border:1px solid var(--l);padding:12px;border-radius:6px;max-width:100%}
input[type=search]{width:100%}
details{margin:12px 0}
summary{cursor:pointer;font-size:20px;font-weight:bold;color:var(--g);background:var(--p);border:1px solid var(--l);border-radius:8px;padding:10px 14px;margin-bottom:12px}
summary.s2{font-size:16px;color:var(--gt)}
ol{margin:6px 0 0;padding-left:28px}
.vt{font-size:24px;font-weight:bold;color:var(--g)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
a{color:var(--gt)}
footer{padding:20px 5% 90px;border-top:1px solid var(--l);color:var(--m);font-size:12px}

.hero{display:block;width:100%;height:auto;border-radius:8px;margin-bottom:14px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:rgba(14,14,14,.97);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:transparent;padding:7px 2px;font-size:12px;line-height:1.25;color:var(--m)}
nav button span{font-size:18px}
nav button.on{color:var(--g);font-weight:bold;box-shadow:inset 0 2px 0 var(--g)}
#sheet{position:fixed;left:8px;right:8px;bottom:64px;z-index:7;display:flex;gap:8px;flex-wrap:wrap;background:rgba(14,14,14,.98);border:1px solid var(--l);border-radius:10px;padding:10px}
#sheet[hidden]{display:none}
.av{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--l);color:var(--t);font-size:11px;font-weight:bold;margin-right:8px;vertical-align:middle;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.rk li{margin:4px 0}
